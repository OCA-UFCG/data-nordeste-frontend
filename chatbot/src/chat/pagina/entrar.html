<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data Nordeste · Assistente de dados</title>
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="stylesheet" href="estilo.css" />
    <style>
      /* Tela da senha da equipe (modo equipe do servidor-chat.ts). */
      .entrar {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--superficie);
      }
      .entrar form {
        width: min(100%, 22rem);
        display: grid;
        gap: 12px;
        padding: 28px 24px;
        background: var(--fundo);
        border: 1px solid var(--borda);
        border-radius: 12px;
        font-family: Inter, system-ui, sans-serif;
        color: var(--texto);
      }
      .entrar h1 { font-size: 1.15rem; margin: 8px 0 0; }
      .entrar p { margin: 0; color: var(--texto-suave); font-size: 0.92rem; line-height: 1.4; }
      .entrar input {
        font: inherit;
        padding: 10px 12px;
        border: 1px solid var(--borda);
        border-radius: 8px;
      }
      .entrar input:focus-visible { outline: 2px solid var(--verde); outline-offset: 1px; }
      .entrar button {
        font: inherit;
        font-weight: 600;
        padding: 10px 12px;
        border: 0;
        border-radius: 8px;
        background: var(--verde);
        color: #fff;
        cursor: pointer;
      }
      .entrar button:disabled { opacity: 0.6; cursor: wait; }
      .entrar .erro { color: var(--erro); min-height: 1.3em; }
      .visualmente-oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    </style>
  </head>
  <body>
    <main class="entrar">
      <form id="form" autocomplete="on">
        <img src="logo.png" alt="Data Nordeste" width="99" height="47" />
        <h1>Assistente de dados</h1>
        <p>Versão de teste para a equipe. Digite a senha que você recebeu.</p>
        <label for="senha" class="visualmente-oculto">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Senha" required autofocus />
        <button type="submit">Entrar</button>
        <p class="erro" id="erro" role="alert"></p>
      </form>
    </main>
    <script>
      const form = document.getElementById("form");
      const erro = document.getElementById("erro");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const botao = form.querySelector("button");
        botao.disabled = true;
        erro.textContent = "";
        try {
          const resp = await fetch("api/entrar", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ senha: form.senha.value }),
          });
          if (resp.ok) return location.reload();
          erro.textContent = (await resp.json().catch(() => ({}))).erro ?? `Erro ${resp.status}.`;
        } catch {
          erro.textContent = "Não foi possível falar com o servidor. Tente de novo.";
        }
        botao.disabled = false;
      });
    </script>
  </body>
</html>
