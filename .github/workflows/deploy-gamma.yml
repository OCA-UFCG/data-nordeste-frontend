name: CI/CD DataNordeste Gamma

on:
  push:
    branches: ["main"]

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # O leg arm64 leva ~10min sob QEMU. Falhar aqui custa 5s e aponta a causa:
      # um package-lock.json regenerado com node_modules presente perde os
      # binarios nativos de outras plataformas. Ver CONTRIBUTING.md.
      - name: Lockfile cobre arm64
        run: grep -q '"node_modules/lightningcss-linux-arm64-gnu"' package-lock.json

      - name: Update docker metadata with the tag
        uses: docker/metadata-action@v4
        id: meta
        with:
          images: ${{ vars.DOCKER_IMAGE_GAMMA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          file: Dockerfile.production
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            ${{ vars.DOCKER_IMAGE_GAMMA }}:latest
            ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_CONTENTFUL_SPACE=${{ secrets.NEXT_PUBLIC_CONTENTFUL_SPACE }}
            NEXT_PUBLIC_CONTENTFUL_ACCESS_TOKEN=${{ secrets.NEXT_PUBLIC_CONTENTFUL_ACCESS_TOKEN_PREVIEW }}
            NEXT_PUBLIC_HOST_URL=${{ vars.NEXT_PUBLIC_HOST_URL_GAMMA }}
            NEXT_PUBLIC_CONTENTFUL_PREVIEW=${{ vars.NEXT_PUBLIC_CONTENTFUL_PREVIEW }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_RECAPTCHA_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_KEY }}
            NEXT_PUBLIC_SURVEY_FEEDBACK_URL=${{ secrets.NEXT_PUBLIC_SURVEY_FEEDBACK_URL }}
            NEXT_PUBLIC_APP_ENV=beta
            NEXT_PUBLIC_AUTOMATIC_REPORT_API_URL=${{ vars.NEXT_PUBLIC_AUTOMATIC_REPORT_API_URL }}

  push-gamma:
    needs: build-image
    runs-on: failover-runner

    steps:
      - name: Pull the latest image
        run: sudo docker pull ${{ vars.DOCKER_IMAGE_GAMMA }}:latest

      - name: Stop existing container
        run: sudo docker rm -f ${{ vars.CONTAINER_NAME_GAMMA }} || true

      - name: Run new container
        run: |
          sudo docker run \
            --name ${{ vars.CONTAINER_NAME_GAMMA }} \
            --restart unless-stopped \
            -e NEXT_PUBLIC_AUTOMATIC_REPORT_API_URL="${{ vars.NEXT_PUBLIC_AUTOMATIC_REPORT_API_URL }}" \
            -p ${{ vars.HOST_PORT_GAMMA }}:${{ vars.CONTAINER_PORT }} \
            -d \
            ${{ vars.DOCKER_IMAGE_GAMMA }}:latest

      - name: Connect to network
        run: |
          sudo docker network connect \
            ${{ vars.NETWORK_NAME }} \
            ${{ vars.CONTAINER_NAME_GAMMA }}

      - name: Prune unused Docker images
        run: sudo docker system prune -f
